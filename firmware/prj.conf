# Voice Keyboard — nRF52840 dongle (PCA10059), Adafruit UF2 bootloader

# --- UF2 drag-and-drop output; Adafruit bootloader layout (app @ 0x26000) ---
# App must stay below the storage partition (0xB4000, see boards overlay).
CONFIG_BUILD_OUTPUT_UF2=y
CONFIG_FLASH_LOAD_OFFSET=0x26000
CONFIG_FLASH_LOAD_SIZE=0x8E000

# --- USB HID keyboard (next USB device stack) ---
# The board defconfig force-enables the legacy stack + CDC ACM console;
# turn it off so only the next stack owns the USBD peripheral.
CONFIG_USB_DEVICE_STACK=n
CONFIG_USB_CDC_ACM=n
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_HID_SUPPORT=y

# --- BLE peripheral: NUS (defined in-app) + DIS ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="VoiceKB"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_SMP=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_FW_REV=y
CONFIG_BT_DIS_FW_REV_STR="vk-5.3"

# --- v5 macro store: accept 180-byte JSON chunks on MACRO_RW ---
# Negotiated ATT MTU = min(L2CAP RX/TX MTU); defaults (65) are too small.
CONFIG_BT_BUF_ACL_RX_SIZE=200
CONFIG_BT_L2CAP_TX_MTU=200
# Keep the controller PDU length at the v4 default: BT_CTLR_DATA_LENGTH_MAX
# would otherwise follow BT_BUF_ACL_RX_SIZE to 200. The host-side MTU only
# needs L2CAP (re)assembly, so pinning this keeps the on-air link layer
# byte-identical to the hardware-verified v4 build.
CONFIG_BT_CTLR_DATA_LENGTH_MAX=27

# --- Bond persistence (settings in flash "storage" partition) ---
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# --- Button + LED ---
CONFIG_GPIO=y

# --- Headless build: no UART console, log to SEGGER RTT ---
CONFIG_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
